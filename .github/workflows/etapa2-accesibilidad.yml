name: etapa2-accesibilidad

# Las tres puertas de la etapa 2 que no caben en go test: i18n completo, cero
# violaciones de accesibilidad sobre las pantallas servidas, y los tres
# presupuestos (binario <25 MB, arranque <3 s, RAM <256 MB).
#
# Va en un fichero propio y no dentro de ci.yml porque ci.yml lo tocan varios
# frentes a la vez y colisionarian.
#
# La tercera parte de esa misma casilla, el TTFV sintetico en menos de 15
# minutos, se mide en .github/workflows/etapa2-ttfv.yml. Los seis numeros de las
# dos mitades pasan por el mismo .github/presupuesto.sh.
#
# Sobre node: el producto NO tiene npm, ni Makefile, ni generadores. El CI si
# puede usar herramientas de node (CLAUDE.md lo dice explicitamente) y axe-core
# es una de ellas. Nada de lo que se instala aqui entra en el binario.
#
# NO HAY DETECCION, y esa es la leccion mas cara de este fichero. La version
# anterior preguntaba si habia pantallas que auditar buscando la palabra "serve"
# en el texto de uso que imprime `plazum` a secas, para poder estar en rojo
# mientras la superficie no existiera. `plazum serve` llevaba semanas existiendo,
# arrancando y sirviendo las seis pantallas, y no aparecia en ese texto: la
# puerta de accesibilidad se quedo en rojo diciendo "el producto no sabe servir
# pantallas", el presupuesto de arranque midio OTRA orden por un camino de
# respaldo, y la RAM del servidor bajo peticiones no se midio nunca. Un rojo que
# miente cuesta lo mismo que un verde que miente: nadie lo lee dos veces.
#
# Ahora no se le pregunta nada al binario: se le PIDE que sirva. Si no sabe, el
# paso se pone rojo con el error del propio binario delante, que es informacion
# de verdad. Y las pantallas que se auditan tampoco estan escritas aqui: se
# descubren del menu que sirve el producto, para que una septima pantalla entre
# sola en la auditoria en vez de quedarse fuera en silencio.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LIMITE_BINARIO_MB: 25
  LIMITE_ARRANQUE_MS: 3000
  LIMITE_RAM_MB: 256

jobs:
  # ---------------------------------------------------------------------------
  # i18n: ni huecos ni claves muertas, y el catalogo sin texto de ninguna norma
  # ---------------------------------------------------------------------------
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}

      # Las tres puertas por separado, para que en el log se vea cual cae.
      #
      # Y cada una comprueba que ha ejecutado algo. `go test -run` con un patron
      # que no casa con nada imprime "no tests to run" y sale con 0: un
      # renombrado de test dejaria la puerta en verde sin comprobar nada, que es
      # la misma clase de verde falso que un axe sobre cero pantallas.
      - name: puertas de i18n y de la frontera legal del catalogo
        shell: bash
        run: |
          set -uo pipefail
          source .github/puerta.sh

          # Los DOS sentidos. Si a en le falta una clave que es tiene, el usuario
          # ingles ve "pantalla.hoy.vacia" en su pantalla; si en tiene una que es
          # no tiene, es una clave muerta o un renombrado a medias. Un aviso no
          # sirve: una traduccion incompleta que solo avisa se queda incompleta.
          puerta "huecos, claves muertas y descuadres de formateo" 3 ./adaptadores/catalogo/ -run "TestPuertaI18n"

          # El catalogo no transporta texto de una norma. Se contrasta contra el
          # texto legal de TODOS los paquetes instalados, y el control negativo
          # demuestra que el contraste muerde.
          puerta "frontera legal del catalogo" 20 ./adaptadores/catalogo/ -run "Cargador|Frontera|Corpus"

          # Toda clave que la interfaz pide esta traducida en los dos idiomas, y
          # ninguna de mas. Es lo que impide que una pantalla salga con la clave
          # en crudo.
          puerta "inventario contra lo que pide la interfaz" 2 ./adaptadores/catalogo/ -run "Cubre|Pantallas"

          cerrar_puertas

      - name: el adaptador entero, incluida la suite de contrato del puerto
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "adaptador de catalogo" 60 ./adaptadores/catalogo/...
          cerrar_puertas

  # ---------------------------------------------------------------------------
  # Presupuestos: medidos de verdad, y en rojo si se pasan
  # ---------------------------------------------------------------------------
  presupuestos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}

      # Con las MISMAS banderas que release.yml. Medir un binario distinto del
      # que se publica seria medir otra cosa.
      - name: binario por debajo de 25 MB
        shell: bash
        run: |
          set -euo pipefail
          source .github/presupuesto.sh
          go build -trimpath -ldflags="-s -w" -o plazum ./cmd/plazum
          bytes=$(stat -c%s plazum)
          awk -v b="$bytes" 'BEGIN{ printf "binario: %.2f MB\n", b/1048576 }'
          presupuesto "binario (bytes)" "$bytes" "$((LIMITE_BINARIO_MB * 1048576))"
          cerrar_presupuestos

      # Arranque en frio del PRODUCTO: desde exec hasta que el puerto acepta
      # conexiones. No mira ninguna ruta a proposito, para no atarse a como se
      # llame ninguna pantalla.
      #
      # Aqui no se pregunta si existe serve. El camino de respaldo que habia
      # ("si el uso no nombra serve, mido `plazum cobertura`") midio durante
      # semanas una orden que no es la que arranca el producto, porque la lista
      # de uso no nombraba serve aunque serve funcionara. Un presupuesto medido
      # sobre otra cosa es peor que no medirlo: sale verde.
      - name: arranque por debajo de 3 s, hasta que el puerto acepta conexiones
        shell: bash
        run: |
          set -euo pipefail
          source .github/presupuesto.sh
          inicio=$(date +%s%N)
          ./plazum serve --direccion 127.0.0.1:8099 --corpus paquetes > serve.log 2>&1 & pid=$!
          listo=no
          for _ in $(seq 1 600); do
            if (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; then listo=si; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.01
          done
          fin=$(date +%s%N)
          kill "$pid" 2>/dev/null || true
          if [ "$listo" != si ]; then
            echo "PUERTA ROTA: 'plazum serve' no acepto conexiones en 127.0.0.1:8099 en 6 s."
            echo "Lo que dijo el binario:"
            cat serve.log
            echo
            echo "El presupuesto de arranque de ETAPAS.md es el del producto, no el de una"
            echo "orden cualquiera: si el servidor no levanta, esta casilla no esta hecha."
            exit 1
          fi
          ms=$(( (fin - inicio) / 1000000 ))
          presupuesto "arranque (ms)" "$ms" "$LIMITE_ARRANQUE_MS"
          cerrar_presupuestos

      # La RAM se mide con DOS metodos que no comparten fallo:
      #
      #   el tope   el proceso corre confinado en un cgroup de 256 MB. Si se
      #             pasa, el kernel lo mata y el paso se pone rojo. No hay
      #             interpretacion posible ni numero que discutir.
      #   el numero el pico de RSS que informa /usr/bin/time -v, que ademas
      #             sirve para ver la tendencia release a release.
      #
      # Y se mide TRABAJANDO, no en reposo: un presupuesto de memoria sobre un
      # proceso que no hace nada no dice nada. Las tres ordenes de abajo son el
      # trabajo mas pesado que el binario sabe hacer hoy (cargar los 30 paquetes,
      # reverificar el expediente demo entero y explicar su derivacion).
      - name: RAM por debajo de 256 MB, trabajando
        shell: bash
        run: |
          set -euo pipefail
          source .github/presupuesto.sh
          # Sin GNU time no hay numero, y sin numero no hay puerta: se instala,
          # no se salta el paso.
          if [ ! -x /usr/bin/time ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq time
          fi
          cap=no
          if command -v systemd-run >/dev/null 2>&1 &&
             sudo systemd-run --scope -p MemoryMax=${LIMITE_RAM_MB}M --quiet /bin/true >/dev/null 2>&1; then
            cap=si
          else
            echo "AVISO: no hay cgroup disponible en este runner. La puerta se queda en el"
            echo "pico de RSS, que sigue bloqueando, pero sin el tope duro del kernel."
          fi
          echo "tope duro por cgroup: $cap"

          ordenes=(
            "cobertura paquetes"
            "verify expediente-demo.json contexto-demo.json"
            "explain expediente-demo.json"
          )
          for orden in "${ordenes[@]}"; do
            # 1. el tope: confinado a 256 MB, sin swap. Si se pasa, muere.
            if [ "$cap" = si ]; then
              sudo systemd-run --scope -p MemoryMax=${LIMITE_RAM_MB}M -p MemorySwapMax=0 \
                --quiet ./plazum $orden > /dev/null || {
                  echo "PUERTA ROTA: 'plazum $orden' no cabe en ${LIMITE_RAM_MB} MB"; exit 1; }
            fi
            # 2. el numero: pico de RSS.
            /usr/bin/time -v ./plazum $orden > /dev/null 2> tiempo.txt || {
              cat tiempo.txt; echo "PUERTA ROTA: 'plazum $orden' fallo"; exit 1; }
            kb=$(awk -F': ' '/Maximum resident set size/ {print $2}' tiempo.txt)
            mb=$(( kb / 1024 ))
            presupuesto "RAM de 'plazum $orden' (MB)" "$mb" "$LIMITE_RAM_MB"
          done

          # Y la medida que de verdad importa: el servidor BAJO PETICIONES, que
          # es como corre en casa del comprador. Un presupuesto de memoria medido
          # sobre un proceso en reposo no mide nada.
          #
          # Sin condicion. Este bloque estuvo detras de un `if` que preguntaba
          # por la palabra "serve" en el texto de uso del binario, y por eso no
          # se ejecuto NUNCA aunque serve llevara semanas funcionando.
          if [ "$cap" = si ]; then
            sudo systemd-run --scope -p MemoryMax=${LIMITE_RAM_MB}M -p MemorySwapMax=0 \
              --quiet ./plazum serve --direccion 127.0.0.1:8099 --corpus paquetes &
          else
            ./plazum serve --direccion 127.0.0.1:8099 --corpus paquetes &
          fi
          listo=no
          for _ in $(seq 1 600); do
            if (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; then listo=si; break; fi
            sleep 0.01
          done
          [ "$listo" = si ] || { echo "PUERTA ROTA: 'plazum serve' no levanto para medirle la RAM"; exit 1; }
          # Se pide /controles, que es la pantalla mas pesada que sirve el
          # producto (unos 150 KB de tabla derivada), y no la raiz, que es una
          # redireccion de 35 bytes: doscientas redirecciones no ejercitan nada.
          # Y se CUENTAN las servidas: doscientos errores tambien gastan poca
          # memoria, y sin contarlas eso saldria verde.
          servidas=0
          for _ in $(seq 1 200); do
            if curl -fsSL -o /dev/null http://127.0.0.1:8099/controles; then
              servidas=$((servidas + 1))
            fi
          done
          echo "peticiones servidas con 200: $servidas de 200"
          [ "$servidas" -eq 200 ] || {
            echo "PUERTA ROTA: solo $servidas de 200 peticiones se sirvieron. Medir la RAM"
            echo "de un servidor que esta devolviendo errores no mide el producto."
            echo "Primer sitio donde mirar: el rate limit general, hoy 600 peticiones por"
            echo "minuto por cliente (LimiteGeneralPorDefecto en superficies/serve). Si se"
            echo "ha bajado por debajo de 200, este numero baja con el, en el mismo commit."
            sudo pkill -f 'plazum serve' 2>/dev/null || true
            exit 1
          }
          # Si el cgroup lo mato por pasarse de 256 MB, aqui ya no hay proceso.
          real=$(pgrep -f 'plazum serve' | head -1 || true)
          [ -n "$real" ] || { echo "PUERTA ROTA: serve no sobrevivio a 200 peticiones dentro de ${LIMITE_RAM_MB} MB"; exit 1; }
          kb=$(ps -o rss= -p "$real" | tr -d ' ')
          mb=$(( kb / 1024 ))
          sudo pkill -f 'plazum serve' 2>/dev/null || true
          presupuesto "RAM de 'plazum serve' tras 200 peticiones (MB)" "$mb" "$LIMITE_RAM_MB"

          cerrar_presupuestos

  # ---------------------------------------------------------------------------
  # Accesibilidad: axe-core, cero violaciones, sobre las pantallas de verdad
  # ---------------------------------------------------------------------------
  accesibilidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      # Versiones fijadas: con @latest la puerta se pone roja o verde sin que
      # nadie toque el codigo, que es lo mismo que decidio ci.yml para gosec.
      - name: instalar axe-core (herramienta de CI, jamas del producto)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/axe"
          cd "$RUNNER_TEMP/axe"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --silent \
            puppeteer@25.9.0 @axe-core/puppeteer@4.13.0 axe-core@4.13.0

      - name: escribir el auditor
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/axe/auditar.mjs" <<'FIN_DEL_AUDITOR'
          // Auditor de accesibilidad de las pantallas servidas.
          //
          // MODO=puerta            exige cero violaciones, HTTP 200 y ninguna
          //                        clave de catalogo sin traducir a la vista.
          // MODO=autocomprobacion  exige lo contrario, al menos una violacion,
          //                        sobre una pagina rota a proposito. Es el
          //                        control negativo del arnes.
          import puppeteer from "puppeteer";
          import { AxePuppeteer } from "@axe-core/puppeteer";

          const MODO = process.env.MODO || "puerta";
          const IDIOMAS = (process.env.IDIOMAS || "es,en").split(",").filter(Boolean);
          const ETIQUETAS = ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa", "best-practice"];

          // Una clave de catalogo a la vista del usuario es un fallo de producto.
          // El espacio de nombres es el mismo que declara la frontera del catalogo
          // en adaptadores/catalogo/frontera.go.
          //
          // EL (?<![\w-]) NO ES ADORNO: sin el, el detector acusaba a prosa
          // correcta. El 03-09-2026 puso el CI en rojo por «aviso.md», que era
          // el final de «docs/hallazgos-preaviso.md» dentro de la cita de una
          // obligacion. Cero violaciones de accesibilidad y la puerta rota por
          // un nombre de fichero.
          //
          // Es la misma familia que la puerta de los numerales de esa manana:
          // una puerta que acusa en falso se acaba borrando, y entonces no
          // vigila nada. Se exige que el prefijo empiece PALABRA, no que
          // aparezca dentro de otra.
          const CLAVE_CRUDA = /(?<![\w-])(?:pantalla|nav|accion|campo|aviso|error|estado|pie)\.[a-z0-9_]+(?:\.[a-z0-9_]+)*/g;

          const urls = process.argv.slice(2);
          if (urls.length === 0) {
            console.error("PUERTA ROTA: no se ha pasado ninguna URL que auditar.");
            process.exit(1);
          }

          // LA SESION, que desde el 04-09-2026 hace falta para auditar la mitad
          // del producto.
          //
          // Hasta ese dia tres pantallas (/acta/, /uar/ y /escalado/) contestaban
          // 401 en un binario recien descargado porque NO HABIA FORMA DE ENTRAR,
          // y este fichero las declaraba sin auditar con su motivo. Ahora se
          // entra, asi que el motivo desaparecio y la deuda se cierra: el paso
          // crea el primer administrador y le pasa aqui la cookie.
          //
          // Va por entorno y no por argumento para que no acabe en la linea de
          // ordenes, que es lo que se ve en el log de una ejecucion publica.
          const COOKIE = process.env.COOKIE_SESION || "";

          const navegador = await puppeteer.launch({
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });
          let fallos = 0;
          let violacionesVistas = 0;

          for (const url of urls) {
            for (const idioma of IDIOMAS) {
              const pagina = await navegador.newPage();
              await pagina.setExtraHTTPHeaders({ "Accept-Language": idioma });
              if (COOKIE) {
                const u = new URL(url);
                // Sin `secure`, porque sobre http la cookie que emite plazum es
                // `plazum_sesion` a secas: el prefijo __Host- exige TLS y el
                // servidor lo sabe. Auditar por https aqui obligaria a un
                // certificado y no cambiaria ni una regla de axe.
                await pagina.setCookie({
                  name: "plazum_sesion", value: COOKIE,
                  domain: u.hostname, path: "/", httpOnly: true,
                });
              }
              let estado = 0;
              try {
                const r = await pagina.goto(url, { waitUntil: "load", timeout: 30000 });
                estado = r ? r.status() : 0;
              } catch (e) {
                console.error(`FALLO ${url} [${idioma}] no se pudo cargar: ${e.message}`);
                fallos++;
                await pagina.close();
                continue;
              }
              if (MODO === "puerta" && estado !== 200) {
                console.error(
                  `FALLO ${url} [${idioma}] responde ${estado}. Auditar la pagina de ` +
                    `error seria un verde falso: la ruta no existe o exige sesion.`
                );
                fallos++;
                await pagina.close();
                continue;
              }

              const resultado = await new AxePuppeteer(pagina).withTags(ETIQUETAS).analyze();
              violacionesVistas += resultado.violations.length;
              for (const v of resultado.violations) {
                console.error(`VIOLACION ${url} [${idioma}] ${v.id} (${v.impact}): ${v.help}`);
                for (const n of v.nodes.slice(0, 5)) console.error(`      en ${n.target.join(" ")}`);
                console.error(`      como se arregla: ${v.helpUrl}`);
              }

              if (MODO === "puerta") {
                fallos += resultado.violations.length;
                const texto = await pagina.evaluate(() =>
                  document.body ? document.body.innerText : ""
                );
                const crudas = [...new Set(texto.match(CLAVE_CRUDA) || [])];
                if (crudas.length > 0) {
                  console.error(
                    `FALLO ${url} [${idioma}] ensena claves de catalogo sin traducir: ` +
                      `${crudas.join(", ")}. Arreglo: anadirlas a ` +
                      `adaptadores/catalogo/cadenas/${idioma}.json`
                  );
                  fallos++;
                }
              }
              console.log(
                `auditada ${url} [${idioma}]: ${resultado.violations.length} violaciones, ` +
                  `${resultado.passes.length} reglas en verde`
              );
              await pagina.close();
            }
          }
          await navegador.close();

          if (MODO === "autocomprobacion") {
            if (violacionesVistas === 0) {
              console.error(
                "EL ARNES NO MUERDE: la pagina de prueba esta rota a proposito y axe no ha " +
                  "encontrado nada. Mientras esto pase, un verde de la puerta de " +
                  "accesibilidad no significaria nada."
              );
              process.exit(1);
            }
            console.log(`el arnes muerde: ${violacionesVistas} violaciones en la pagina rota`);
            process.exit(0);
          }

          if (fallos > 0) {
            console.error(`PUERTA ROTA: ${fallos} fallos de accesibilidad o de traduccion.`);
            process.exit(1);
          }
          console.log("cero violaciones y ninguna clave sin traducir.");
          FIN_DEL_AUDITOR

      # El control negativo del arnes, con la misma disciplina que los tests del
      # repo: se demuestra que el detector detecta ANTES de creerse su verde.
      # La pagina de abajo tiene cuatro fallos puestos a mano.
      - name: autocomprobacion del arnes (control negativo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rota"
          cat > "$RUNNER_TEMP/rota/rota.html" <<'FIN_DE_LA_PAGINA'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><title>pagina rota a proposito</title></head>
          <body>
          <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
          <p style="color:#cccccc;background:#ffffff">texto con contraste insuficiente</p>
          <div onclick="void 0">un boton que no es un boton</div>
          </body>
          </html>
          FIN_DE_LA_PAGINA
          (cd "$RUNNER_TEMP/rota" && python3 -m http.server 8123 > /dev/null 2>&1 &)
          for _ in $(seq 1 100); do
            (exec 3<>/dev/tcp/127.0.0.1/8123) 2>/dev/null && break
            sleep 0.05
          done
          cd "$RUNNER_TEMP/axe"
          MODO=autocomprobacion IDIOMAS=es node auditar.mjs http://127.0.0.1:8123/rota.html

      - name: puerta de accesibilidad sobre las pantallas que sirve el producto
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o plazum ./cmd/plazum

          ./plazum serve --direccion 127.0.0.1:8099 --corpus paquetes > serve.log 2>&1 & pid=$!
          listo=no
          for _ in $(seq 1 600); do
            if (exec 3<>/dev/tcp/127.0.0.1/8099) 2>/dev/null; then listo=si; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.01
          done
          if [ "$listo" != si ]; then
            echo "PUERTA ROTA: no hay pantallas que auditar porque 'plazum serve' no levanto."
            echo "Lo que dijo el binario:"
            cat serve.log
            echo
            echo "Auditar lo que no se puede abrir es imposible, y dar esto por verde diria"
            echo "que la accesibilidad esta comprobada cuando no se ha comprobado nada."
            exit 1
          fi

          # SE ENTRA, Y SIN ESTO EL PASO SE PONE ROJO ENTERO.
          #
          # Desde el 04-09-2026 `plazum serve` exige un administrador, asi que
          # `/` en una instalacion nueva redirige a /primer-admin, que no tiene
          # menu: la extraccion de abajo daria cero pantallas. El propio fichero
          # llevaba tiempo declarando este trabajo como pendiente para poder
          # auditar /uar/ y /acta/; ya no es opcional, y de paso cierra aquella
          # deuda.
          #
          # Las ordenes estan copiadas de un recorrido ejecutado contra el
          # binario, no escritas de memoria: el token va indentado con cinco
          # espacios en el recuadro del arranque, el CSRF es hexadecimal de 64 y
          # el identificador de sesion ROTA al crear la cuenta (defensa de
          # fijacion), asi que la cookie que vale es la de DESPUES del POST.
          token=$(grep -oE '^ {5}[0-9a-f]{64}$' serve.log | tr -d ' ')
          if [ -z "$token" ]; then
            echo "PUERTA ROTA: plazum no ha impreso token de instalacion, asi que no hay"
            echo "forma de crear el administrador y no hay nada que auditar."
            cat serve.log
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          curl -s -c galletas.txt -o form.html http://127.0.0.1:8099/primer-admin
          csrf=$(grep -oE 'name="csrf" value="[0-9a-f]+"' form.html | head -1 \
            | grep -oE '[0-9a-f]{16,}')
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -b galletas.txt -c galletas.txt \
            -d "csrf=$csrf" -d "token=$token" \
            -d "usuario=ciso" -d "secreto=contrasena-larga-de-ci-2026" \
            http://127.0.0.1:8099/primer-admin)
          if [ "$codigo" != 303 ]; then
            echo "PUERTA ROTA: no se ha podido crear el administrador (HTTP $codigo)."
            echo "Sin sesion, la mitad de las pantallas contesta 401 y auditar la de"
            echo "'entra primero' en lugar de la de verdad seria un verde falso."
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          COOKIE_SESION=$(grep plazum_sesion galletas.txt | awk '{print $7}' | tail -1)
          export COOKIE_SESION
          if [ -z "$COOKIE_SESION" ]; then
            echo "PUERTA ROTA: el alta dio 303 y no hay cookie de sesion. O el nombre de la"
            echo "cookie cambio, o el servidor dejo de emitirla."
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          # Las pantallas SE DESCUBREN del menu que sirve el producto. Escribir
          # las seis rutas aqui seria una lista paralela: el dia que
          # nucleo/pantalla derive una septima, tendria ruta y entrada de menu
          # sola (superficies/pantallas las registra recorriendo el modelo) y
          # esta auditoria seguiria mirando seis, en verde.
          pantallas=$(curl -fsSL -b "plazum_sesion=$COOKIE_SESION" http://127.0.0.1:8099/ \
            | awk '/<nav id="navegacion"/,/<\/nav>/' \
            | grep -oE 'href="/[a-z0-9/-]*"' \
            | sed 's/^href="//; s/"$//' \
            | sort -u)
          n=$(printf '%s\n' "$pantallas" | grep -c . || true)
          echo "pantallas descubiertas en el menu ($n):"
          printf '  %s\n' $pantallas
          # El suelo es el numero de pantallas que declara ETAPAS.md. Sin el, un
          # menu que dejara de pintarse dejaria la auditoria sobre cero paginas y
          # el job en verde, que es justo el verde falso que este fichero
          # persigue.
          if [ "$n" -lt 6 ]; then
            echo "PUERTA ROTA: el menu del producto ofrece $n pantallas y la etapa 2 declara 6."
            echo "O se han perdido pantallas, o el menu ha cambiado de forma y esta puerta"
            echo "auditaria menos de lo que hay. Arreglo: mirar la navegacion que sirve"
            echo "superficies/pantallas y ajustar la extraccion de arriba."
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          # La raiz y /entrar van aparte de las descubiertas, y por el mismo
          # motivo las dos: son las paginas que se ven ANTES de que haya menu,
          # asi que no pueden salir de el. /entrar es ademas la primera pantalla
          # de cualquier despliegue con autenticacion, y auditar solo las seis
          # derivadas la dejaba fuera: cuando se anadio aqui traia dos
          # violaciones (landmark-one-main y region) que llevaban ahi desde
          # siempre.
          # La raiz y /entrar van aparte de las descubiertas, y por el mismo
          # motivo las dos: son las paginas que se ven ANTES de que haya menu.
          #
          # LO QUE ESTA PUERTA NO AUDITA HOY, dicho para que no se de por
          # auditado: /uar/ y /acta/. Son otras superficies, no salen del menu de
          # aquellas, y sobre todo **exigen sesion**: son las dos del producto
          # cuyo contenido son nombres de personas, asi que sin cookie contestan
          # 401. Y este auditor exige 200 con razon, porque auditar la pagina de
          # "entra primero" en lugar de la de verdad seria exactamente el verde
          # falso que este fichero persigue.
          #
          # SON DOS Y NO UNA desde el 01-09-2026, y el matiz importa porque no
          # llevan lo mismo: /uar/ ensena a los SUJETOS revisados (el rotulo con
          # el que el IdP nombra cada cuenta) y /acta/ ensena a los ACTORES (quien
          # audito, quien difirio y con que motivo, quien decidio cada acceso,
          # quien excuso una linea, quien asistio). El acta apaga los sujetos por
          # defecto y no puede apagar a los actores: un acta que no dice quien
          # hizo que no es evidencia de nada.
          #
          # Para cubrirlas hace falta que este paso ENTRE: leer el token de primer
          # administrador que imprime el arranque, crear la cuenta, guardar la
          # cookie y pasarsela a puppeteer. Es trabajo real y va apuntado, no
          # disimulado. El dia que se haga, se hacen las dos.
          urls="http://127.0.0.1:8099/ http://127.0.0.1:8099/entrar"
          for r in $pantallas; do urls="$urls http://127.0.0.1:8099$r"; done

          # LA LISTA LARGA DE LA ENTREVISTA, QUE NO ES UNA PANTALLA MAS.
          #
          # El menu descubre rutas, y `/alcance?ver=todas` no es una ruta: es la
          # misma con otro parametro. Asi que la revelacion progresiva dejaba su
          # mitad larga (la que pinta el bloque de preguntas dormidas con su
          # cardinal y su motivo) SIN AUDITAR, y la corta si.
          #
          # Lo dijo el frente que la construyo, en vez de dejar que se
          # descubriera solo. Es la familia del tramo: cada mitad pasa su puerta
          # y la junta no la mira nadie.
          urls="$urls http://127.0.0.1:8099/alcance?ver=todas"

          # LAS TRES QUE EXIGEN SESION, que este fichero declaraba sin auditar
          # con su motivo hasta el 04-09-2026. El motivo era que no habia forma
          # de entrar; ya la hay, asi que la deuda se cierra en vez de heredarse.
          for r in /acta/ /uar/ /escalado/; do
            urls="$urls http://127.0.0.1:8099$r"
          done

          # LO QUE SIGUE SIN AUDITARSE, Y SE DICE PARA QUE NO SE DE POR
          # AUDITADO: /primer-admin, que desde hoy es la PRIMERA pantalla de
          # toda instalacion y por tanto la que mas gente va a ver.
          #
          # No cabe en esta lista porque solo existe ANTES de que haya
          # administrador: una vez creado contesta 303, y este auditor exige 200
          # con razon. Auditarla pide una segunda pasada del auditor antes del
          # alta, y eso es trabajo, no una linea. Va apuntado, no disimulado.

          # El || protege del set -e: hace falta llegar al kill pase lo que pase.
          estado=0
          (cd "$RUNNER_TEMP/axe" && MODO=puerta IDIOMAS=es,en node auditar.mjs $urls) || estado=$?
          kill "$pid" 2>/dev/null || true
          exit $estado
