# Distribucion: que el producto se construya y ARRANQUE en las tres plataformas
# y dentro de una imagen minima.
#
# POR QUE ESTE WORKFLOW EXISTE APARTE DE ci.yml. ci.yml corre la suite en Linux.
# Eso dice que el codigo es correcto y no dice nada de lo unico que ve el que se
# baja el producto: si el binario de SU sistema se construye, arranca y llega al
# valor. Un fallo de plataforma (una ruta con barra invertida, un fichero abierto
# dos veces, una zona horaria que no resuelve) pasa la suite entera en Linux y
# muere en la maquina del comprador.
#
# ESTE WORKFLOW NO PUBLICA NADA. No hay login a ningun registro, no hay push de
# ninguna imagen, no hay release y no hay firma. La marca esta congelada
# (.github/marca-congelada, motivo en docs/marca.md) y la imagen se construye y
# se prueba ENTERA sin salir de la maquina que la construye. Que siga siendo asi
# lo vigila distribucion_test.go en la raiz, que lee estos ficheros.
name: etapa2-distribucion

on:
  push: {branches: [main, master]}
  pull_request:

permissions: {contents: read}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Las tres plataformas, con la suite y con el binario ARRANCADO.
  # ---------------------------------------------------------------------------
  matriz:
    name: ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      # fail-fast a false a proposito: si Windows se rompe, se quiere ver
      # tambien si macOS se rompia por lo mismo o por otra cosa. Con fail-fast
      # se cancela el resto y hay que adivinar.
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}

      - name: build
        run: go build ./...

      # La suite entera en cada sistema. Pasa por puerta(), que cuenta los casos
      # EJECUTADOS: `go test` sale con codigo 0 cuando el glob no tiene tests y
      # cuando el patron -run no casa, y las dos cosas son verdes falsos.
      #
      # El minimo. Medido hoy: 847 casos en Windows y 848 en Linux (la diferencia
      # es TestElDoctorDistingueUnKeystoreAusenteDeUnoIlegible/permisos_abiertos,
      # que se salta en Windows porque alli los permisos POSIX no significan lo
      # mismo). Se declara 800 y no 847 porque esta puerta mide DIFERENCIAS DE
      # PLATAFORMA, y ponerse roja por un salto legitimo de macOS seria ponerse
      # roja por lo que viene a medir. 800 sigue cazando el caso que importa: que
      # un sistema ejecute la mitad de la suite y nadie lo note.
      - name: suite completa en este sistema
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "suite completa en ${{ matrix.sistema }}" 800 ./...
          cerrar_puertas

      # Y aqui lo que la suite no puede decir: que el binario de verdad, el que
      # se descarga, hace algo util al ejecutarlo. Se prueba con ORDENES, no con
      # handlers.
      - name: el binario arranca y llega al valor
        shell: bash
        run: |
          set -uo pipefail
          FALLOS=0
          fallo() { echo "PUERTA ROTA: $*"; FALLOS=$((FALLOS + 1)); }
          bien()  { echo "  ok  $*"; }

          BIN="./plazum"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="./plazum.exe"; fi
          go build -trimpath -o "$BIN" ./cmd/plazum
          [ -x "$BIN" ] || { echo "no se ha construido $BIN"; exit 1; }

          # Todas las rutas RELATIVAS al repositorio, a proposito. En el runner
          # de Windows este script corre en Git Bash pero el binario es nativo:
          # una ruta como /tmp/xxx que aqui existe, alli se lee como C:\tmp\xxx.
          # Las rutas relativas las entienden los dos igual.
          TRABAJO=trabajo-distribucion
          rm -rf "$TRABAJO" && mkdir -p "$TRABAJO"

          # 1. demo: UN comando, sin configurar nada, en un directorio vacio.
          if "$BIN" demo --dir "$TRABAJO/demo" --ahora 2026-08-25T09:00:00Z \
               > "$TRABAJO/demo.txt" 2>&1; then
            bien "plazum demo termina con 0"
          else
            fallo "plazum demo ha fallado"; cat "$TRABAJO/demo.txt"
          fi
          for trozo in "APLICA  demo." "QUE HACER AHORA" "no es asesoramiento juridico"; do
            if grep -qF "$trozo" "$TRABAJO/demo.txt"; then bien "el demo ensena: $trozo"
            else fallo "el demo NO ensena: $trozo"; fi
          done

          # 2. verify sobre el expediente demo: la orden que define el producto.
          if "$BIN" verify expediente-demo.json contexto-demo.json > "$TRABAJO/verify.txt" 2>&1; then
            bien "plazum verify termina con 0"
          else
            fallo "plazum verify ha fallado en ${{ matrix.sistema }}"; cat "$TRABAJO/verify.txt"
          fi
          if grep -qF "VERIFICADO" "$TRABAJO/verify.txt"; then bien "el expediente demo VERIFICA"
          else fallo "el expediente demo NO verifica en este sistema"; cat "$TRABAJO/verify.txt"; fi

          # 3. explain: el descargo de asesoramiento juridico tiene que estar en
          #    la salida que el operador imprime y se lleva a una reunion.
          if "$BIN" explain expediente-demo.json > "$TRABAJO/explain.txt" 2>&1; then
            bien "plazum explain termina con 0"
          else
            fallo "plazum explain ha fallado"; cat "$TRABAJO/explain.txt"
          fi
          if tr '\n' ' ' < "$TRABAJO/explain.txt" | grep -qF "no presta asesoramiento"; then
            bien "plazum explain lleva el descargo"
          else
            fallo "plazum explain se sirve SIN el descargo de asesoramiento juridico"
            cat "$TRABAJO/explain.txt"
          fi

          # 4. cobertura del corpus publicado.
          if "$BIN" cobertura paquetes > "$TRABAJO/cobertura.txt" 2>&1; then
            bien "plazum cobertura termina con 0"
          else
            fallo "plazum cobertura ha fallado"; cat "$TRABAJO/cobertura.txt"
          fi

          if [ "$FALLOS" -gt 0 ]; then echo "$FALLOS puertas rotas."; exit 1; fi
          echo "el binario de ${{ matrix.sistema }} arranca y llega al valor."

  # ---------------------------------------------------------------------------
  # 2. La imagen. Se construye, se prueba por dentro y NO se publica.
  # ---------------------------------------------------------------------------
  imagen:
    name: imagen Docker (sin publicar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: construir la imagen
        run: docker build -t plazum:ci .

      # La puerta del contenedor. Lo que se comprueba aqui NO se puede comprobar
      # con un test de Go: son propiedades de la imagen y de lo que le falta a
      # scratch.
      - name: la imagen arranca, verifica y no corre como root
        run: |
          set -uo pipefail
          FALLOS=0
          fallo() { echo "PUERTA ROTA: $*"; FALLOS=$((FALLOS + 1)); }
          bien()  { echo "  ok  $*"; }
          TRABAJO="$(mktemp -d)"

          # --- 1. arranca sola, sin flags, sin montar nada -----------------
          if docker run --rm plazum:ci > "$TRABAJO/demo.txt" 2>&1; then
            bien "docker run --rm plazum:ci termina con 0"
          else
            fallo "la imagen no arranca"; cat "$TRABAJO/demo.txt"
          fi
          for trozo in "APLICA  demo." "QUE HACER AHORA" "no es asesoramiento juridico"; do
            if grep -qF "$trozo" "$TRABAJO/demo.txt"; then bien "la imagen ensena: $trozo"
            else fallo "la imagen NO ensena: $trozo"; fi
          done

          # --- 2. verify DENTRO de la imagen -------------------------------
          #
          # Esta es la puerta de las zonas horarias, y nace de un fallo real.
          # scratch no trae /usr/share/zoneinfo, asi que sin la base embebida
          # (cmd/plazum/zonas.go) `verify` NO revienta: responde NO VERIFICA
          # sobre un expediente correcto, o sea acusa al emisor de haber
          # falseado su expediente cuando el roto es el receptor. Ese es el peor
          # fallo posible en un producto cuya tesis es que el receptor no se fia.
          if docker run --rm plazum:ci verify expediente-demo.json contexto-demo.json \
               > "$TRABAJO/verify.txt" 2>&1; then
            bien "verify dentro de la imagen termina con 0"
          else
            fallo "verify dentro de la imagen ha fallado"; cat "$TRABAJO/verify.txt"
          fi
          if grep -qF "VERIFICADO" "$TRABAJO/verify.txt"; then
            bien "el expediente demo VERIFICA dentro de la imagen"
          else
            fallo "el expediente demo NO verifica dentro de la imagen"
            echo "  Si las discrepancias hablan de zonas horarias, lo que falta es la base"
            echo "  de zonas embebida en el binario: ver cmd/plazum/zonas.go."
            cat "$TRABAJO/verify.txt"
          fi

          # --- 3. explain con su descargo ----------------------------------
          docker run --rm plazum:ci explain expediente-demo.json > "$TRABAJO/explain.txt" 2>&1 || true
          if tr '\n' ' ' < "$TRABAJO/explain.txt" | grep -qF "no presta asesoramiento"; then
            bien "explain dentro de la imagen lleva el descargo"
          else
            fallo "explain dentro de la imagen NO lleva el descargo"; cat "$TRABAJO/explain.txt"
          fi

          # --- 4. el corpus viaja dentro -----------------------------------
          if docker run --rm plazum:ci cobertura paquetes > "$TRABAJO/cobertura.txt" 2>&1; then
            bien "el corpus esta dentro de la imagen y se mide"
          else
            fallo "cobertura del corpus dentro de la imagen"; cat "$TRABAJO/cobertura.txt"
          fi

          # --- 5. sin privilegios ------------------------------------------
          usuario=$(docker inspect -f '{{.Config.User}}' plazum:ci)
          if [ "$usuario" = "65532:65532" ]; then bien "corre como $usuario y no como root"
          else fallo "la imagen corre como '$usuario' y tiene que correr como 65532:65532"; fi

          # --- 6. sin shell ------------------------------------------------
          #
          # Que no haya interprete de ordenes no es cosmetico: es la diferencia
          # entre una ejecucion remota de codigo que consigue una consola y una
          # que se queda sin nada que ejecutar.
          for interprete in /bin/sh /bin/bash /bin/busybox; do
            if docker run --rm --entrypoint "$interprete" plazum:ci -c 'echo hola' \
                 > /dev/null 2>&1; then
              fallo "la imagen trae $interprete y no puede traer ninguno"
            else
              bien "no hay $interprete en la imagen"
            fi
          done

          # --- 7. tamano ----------------------------------------------------
          #
          # Medido hoy: 15 MB sin comprimir (9,6 del binario, 0,7 del corpus,
          # 0,24 de las raices de CA y el resto de los ficheros de ejemplo). El
          # techo se pone en 60 y no en 20 a proposito: el numero que devuelve
          # docker depende del almacen de imagenes (con el de containerd sale
          # bastante mas bajo), asi que una puerta ajustada se pondria roja por
          # la version de docker del runner y no por el producto. Con 60 sigue
          # cazando lo que importa: que se cuele dentro un arbol entero.
          bytes=$(docker image inspect -f '{{.Size}}' plazum:ci)
          mb=$((bytes / 1000000))
          echo "  la imagen ocupa ${mb} MB"
          if [ "$mb" -gt 60 ]; then
            fallo "la imagen ocupa ${mb} MB y el techo son 60. Algo se ha colado dentro:"
            fallo "  mira .dockerignore y las lineas COPY del Dockerfile."
          else
            bien "la imagen cabe en el presupuesto (${mb} MB de 60)"
          fi

          if [ "$FALLOS" -gt 0 ]; then echo "$FALLOS puertas rotas."; exit 1; fi
          echo "la imagen arranca, verifica y no trae de mas."

      # La interfaz web, servida desde el contenedor y pedida por la red de
      # verdad. Sin esto, "la imagen sirve la UI" es una suposicion.
      - name: la interfaz web se sirve desde el contenedor
        run: |
          set -uo pipefail
          docker run -d --name plazum-web -p 18443:8443 plazum:ci \
            serve --direccion 0.0.0.0:8443 > /dev/null
          trap 'docker logs plazum-web 2>&1 | tail -30; docker rm -f plazum-web > /dev/null' EXIT

          listo=no
          for _ in $(seq 1 100); do
            if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:18443/salud; then
              listo=si; break
            fi
            sleep 0.2
          done
          if [ "$listo" != si ]; then
            echo "PUERTA ROTA: el servidor del contenedor no responde en /salud"
            exit 1
          fi
          echo "  ok  el contenedor sirve /salud"

          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:18443/)
          if [ "$codigo" = "303" ] || [ "$codigo" = "200" ]; then
            echo "  ok  la raiz responde $codigo"
          else
            echo "PUERTA ROTA: la raiz responde $codigo"
            exit 1
          fi

      # Reproducibilidad, comprobada y no prometida. Se construye OTRA VEZ desde
      # cero y se compara el sha256 del binario que sale de cada imagen. Se
      # compara el binario y no el digest de la imagen porque el digest arrastra
      # marcas de tiempo de las capas, que dependen del exportador y no del
      # codigo: comparar eso daria rojos que no son fallos y ensenaria a la
      # gente a ignorar esta puerta.
      #
      # LO QUE ESTA COMPROBACION NO DICE, escrito aqui para que nadie le pida
      # mas de lo que da: las dos construcciones ocurren en la MISMA ruta
      # (/src, dentro del contenedor) y con la MISMA version de Go, asi que
      # -trimpath no cambia nada entre las dos. Lo que caza es la
      # indeterminacion de verdad (una fecha embebida, un orden de mapa que se
      # cuela en el binario, un go:embed de algo que cambia). Que -trimpath
      # este es lo que hace que un tercero pueda reproducir el binario en SU
      # maquina, en otra ruta, y eso lo vigila distribucion_test.go leyendo el
      # Dockerfile. La comprobacion fuerte (construir fuera de la imagen y
      # comparar) pide fijar la version exacta de Go en los dos sitios: esta
      # anotada como pendiente, no hecha.
      - name: dos construcciones del mismo commit dan el mismo binario
        run: |
          set -uo pipefail
          sacar() {
            id=$(docker create "$1")
            docker cp "$id:/plazum" "$2" > /dev/null
            docker rm "$id" > /dev/null
          }
          sacar plazum:ci /tmp/plazum-1
          docker build --no-cache -t plazum:ci-bis .
          sacar plazum:ci-bis /tmp/plazum-2
          a=$(sha256sum /tmp/plazum-1 | cut -d' ' -f1)
          b=$(sha256sum /tmp/plazum-2 | cut -d' ' -f1)
          echo "  construccion 1: $a"
          echo "  construccion 2: $b"
          if [ "$a" != "$b" ]; then
            echo "PUERTA ROTA: dos construcciones del mismo commit dan binarios distintos."
            echo "  Un binario que no se puede reproducir no se puede auditar: nadie de fuera"
            echo "  puede comprobar que el binario publicado sale de este codigo."
            echo "  Arreglo: mirar -trimpath, -buildid= y CGO_ENABLED=0 en el Dockerfile, y"
            echo "  que no haya entrado en el contexto nada que cambie solo (.dockerignore)."
            exit 1
          fi
          echo "  ok  el binario es reproducible ($a)"

      # La otra arquitectura. No se carga ni se ejecuta (un runner amd64 no
      # puede), solo se construye: lo que se caza aqui es el dia que algo del
      # codigo deje de cruzar a arm64, que es la mitad de las maquinas de los
      # compradores nuevos.
      - name: la imagen tambien cruza a arm64
        run: |
          docker buildx build --platform linux/arm64 --output type=cacheonly .

      # Y el recordatorio, por si alguien llega hasta aqui buscando el push.
      - name: no se publica nada
        run: |
          echo "Este workflow NO publica. La marca esta congelada:"
          cat .github/marca-congelada
