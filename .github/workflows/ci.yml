name: ci

# El disparador por horario NO es rutina, y conviene que se sepa por que esta.
#
# El 26-08-2026 main amanecio ROJO sin que nadie hubiera tocado una linea. Un
# test del doctor tenia cableado "2026-08-26 09:00 UTC" como instante de
# prueba, y comparaba ese instante con la fecha de modificacion de un
# directorio temporal creado ahora de verdad. Se escribio la tarde del 25, con
# el instante en el futuro, y estallo catorce horas despues.
#
# Sin este horario, ese rojo habria esperado al siguiente empujon para
# aparecer, y habria aparecido MEZCLADO con un cambio que no tenia nada que
# ver, que es la forma mas cara de encontrarlo.
#
# Es la puerta de una clase entera, no de un test: cualquier verde que caduque
# con el reloj de pared (un certificado de prueba, una fecha de vigencia de un
# paquete, una raiz de TSA, un plazo del corpus que vence) se cae aqui y se cae
# SOLO, sin nada mas en el diff.
on:
  push: {branches: [main, master]}
  pull_request:
  schedule:
    # 06:17 UTC. La hora es rara a proposito: en punto es cuando GitHub
    # encola mas trabajos y mas se retrasan.
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}
      - name: formato
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      # Las dos suites pasan por puerta(), que cuenta los casos EJECUTADOS y
      # exige un minimo. `go test` sale con codigo 0 cuando el patron -run no
      # casa con nada y cuando el glob de paquetes no tiene tests: sin contar,
      # una suite que se ha quedado en nada da exactamente el mismo verde que
      # una suite entera. Ver .github/puerta.sh.
      #
      # El minimo se sube en el mismo commit que hace crecer la suite. Es
      # deliberadamente incomodo: obliga a notar cuando MENGUA.
      - name: tests (incluye AST, extensibilidad con control negativo y linter de paquetes)
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "suite completa" 700 ./...
          cerrar_puertas
      # El detector de carreras solo se cubre aqui: exige cgo y la maquina de
      # desarrollo es Windows sin compilador de C, asi que en local no corre
      # nunca. Si esta puerta se quita, las carreras dejan de mirarse en todo
      # el proyecto. Va aparte del paso anterior porque -race cambia el binario
      # y queremos ver cual de los dos falla.
      - name: tests con detector de carreras
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "suite completa con detector de carreras" 700 ./... -race
          cerrar_puertas
      # La ingesta legal aparte, y no por ceremonia: la suite completa dice que
      # el repo tiene 700 casos, no que ESTOS sigan estando. Si alguien mueve el
      # directorio o borra los tests de los parsers, el suelo de 700 lo absorbe
      # sin pestanear y la unica pieza que toca datos de un tercero se queda sin
      # vigilar. Aqui va con su propio suelo, que es el numero real de hoy.
      - name: ingesta legal (BOE y EUR-Lex) y deteccion de cambios
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "ingesta legal y vigilancia normativa" 70 ./herramientas/ingestanorma/...
          cerrar_puertas
      # El anclaje y el pkcs7 vendorizado aparte, por el MISMO motivo que la
      # ingesta legal y con las mismas palabras: el suelo de 700 de la suite
      # completa dice que el repo tiene 700 casos, no que ESTOS sigan estando.
      #
      # Y aqui pesa mas que en ningun otro sitio, porque adaptadores/tsa es, en
      # palabras de DEPENDENCIAS.md, "la unica criptografia del proyecto que
      # trabaja sobre bytes de un tercero": el token RFC 3161 lo trae el
      # expediente, o sea alguien de quien explicitamente no nos fiamos. Si
      # alguien borra el fuzzing del parser vendorizado, o la puerta de
      # procedencia que comprueba que nadie ha editado codigo ajeno sin
      # anotarlo, o el detector del pkcs7 transitivo que revienta, el suelo de
      # 700 lo absorbe sin pestanear y la pieza se queda sin vigilar. Esa es
      # exactamente la forma de guarda que este proyecto ya ha visto fallar
      # trece veces (docs/pendientes.md).
      #
      # El suelo es el numero real de hoy menos un margen: 82 casos ejecutados.
      - name: anclaje RFC 3161 y pkcs7 vendorizado (fuzzing, procedencia, amplificacion)
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "anclaje y pkcs7 vendorizado" 78 ./adaptadores/tsa/...
          cerrar_puertas
      # SCIM va con puerta propia por el mismo motivo que el anclaje: es la
      # unica superficie de RED AUTENTICADA que da de alta y de baja a personas,
      # o sea la que se lleva un CVE. El suelo de 700 de la suite completa se
      # traga sin pestanear que alguien borre el fichero entero de los controles
      # negativos de la credencial.
      #
      # Y hay una segunda puerta detras, la de cobertura: SCIM estuvo al 46,4%
      # mientras el repositorio entero iba al 77,1%. Un paquete muy por debajo
      # de la media no se nota en el numero global, y este era justo el que no
      # convenia que estuviera flojo.
      #
      # El suelo es el numero real de hoy menos un margen: 79 casos ejecutados.
      - name: SCIM, la superficie que aprovisiona personas
        shell: bash
        run: |
          set +e
          set -uo pipefail
          source .github/puerta.sh
          puerta "SCIM (directorio y superficie HTTP)" 74 ./adaptadores/scim/... ./superficies/scim/... -coverprofile=cover-scim.out
          cerrar_puertas
          pct=$(go tool cover -func=cover-scim.out | tail -1 | awk '{sub("%","",$NF); print $NF}')
          echo "cobertura de SCIM: ${pct}%"
          # La comparacion se hace con awk porque bash no sabe de decimales: con
          # [ "$pct" -lt 75 ] un 79.5 es un error de sintaxis, no una comparacion.
          if awk -v p="$pct" 'BEGIN{exit !(p < 75)}'; then
            echo "PUERTA ROTA: SCIM ha bajado al ${pct}% y el minimo es 75%."
            echo "  Esto es la superficie autenticada por la que un IdP ajeno da de alta y de"
            echo "  baja a personas. Un endpoint sin test no es codigo sin probar: es una"
            echo "  puerta que nadie ha intentado abrir."
            echo "  Arreglo: mirar que ha entrado sin test con"
            echo "    go tool cover -func=cover-scim.out | awk '\$NF+0 < 80'"
            exit 1
          fi

      # El cribador de marcas, con puerta propia. No es producto: es la
      # herramienta cuyo UNICO PRODUCTO ES UNA PRUEBA, y con esa prueba se
      # decidio el nombre. Ya fallo dos veces de la misma forma, y las dos la
      # salida se leia exactamente igual que una buena: la cabecera decia EUIPO
      # mirara donde mirara, y el transporte podia contestar 200 con la lista
      # vacia sin que nada lo dijera.
      #
      # El suelo es el numero real de hoy menos un margen: 29 casos ejecutados.
      - name: cribador de marcas (las tres lentes y el canario de transporte)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          source .github/puerta.sh
          puerta "cribador de marcas" 26 ./herramientas/cribamarca/... -coverprofile=cover-criba.out
          cerrar_puertas
          pct=$(go tool cover -func=cover-criba.out | tail -1 | awk '{sub("%","",$NF); print $NF}')
          echo "cobertura del cribador: ${pct}%"
          if awk -v p="$pct" 'BEGIN{exit !(p < 80)}'; then
            echo "PUERTA ROTA: el cribador ha bajado al ${pct}% y el minimo es 80%."
            echo "  Con esta herramienta se decide un nombre, y un nombre mal decidido cuesta"
            echo "  un renombrado de punta a punta. Ya paso una vez."
            echo "  Arreglo: mirar que ha entrado sin test con"
            echo "    go tool cover -func=cover-criba.out | awk '\$NF+0 < 90'"
            exit 1
          fi

      - name: cobertura del nucleo (puerta dura 85%)
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "cobertura del nucleo" 200 ./nucleo/... -coverprofile=cover.out
          cerrar_puertas
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{sub("%","",$NF); print $NF}')
          echo "cobertura del nucleo: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 85) { print "PUERTA ROTA: cobertura " p "% < 85%"; exit 1 } }'
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # El job de test corre con la version declarada en go.mod (1.24): esa es la
      # puerta de compatibilidad. Aqui hace falta una mas nueva porque las
      # herramientas de seguridad la exigen, y setup-go v7 fija GOTOOLCHAIN=local,
      # asi que ya no se descarga sola.
      - uses: actions/setup-go@v7
        with: {go-version: '1.25'}
      # Versiones fijadas a proposito: con @latest la puerta se pone roja o verde
      # sin que nadie toque el codigo. Fijar el binario no envejece el analisis,
      # govulncheck baja la base de vulnerabilidades en cada ejecucion.
      - name: govulncheck (bloqueante)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: gosec (bloqueante)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...
# Se amplia por etapas (ver ETAPAS.md): release firmada + SBOM CycloneDX (E1, con v0.2),
# fuzzing (E1), presupuestos + axe + TTFV (E2), evals nightly (E5), canario de conectores (E6).
# El CI puede usar herramientas de node (axe-core) aunque el producto no tenga npm.
