name: ci
on:
  push: {branches: [main, master]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}
      - name: formato
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: tests (incluye AST, extensibilidad con control negativo y linter de paquetes)
        run: go test ./... -count=1
      # El detector de carreras solo se cubre aqui: exige cgo y la maquina de
      # desarrollo es Windows sin compilador de C, asi que en local no corre
      # nunca. Si esta puerta se quita, las carreras dejan de mirarse en todo
      # el proyecto. Va aparte del paso anterior porque -race cambia el binario
      # y queremos ver cual de los dos falla.
      - name: tests con detector de carreras
        run: go test ./... -race -count=1
      - name: cobertura del nucleo (puerta dura 85%)
        run: |
          go test ./nucleo/... -coverprofile=cover.out
          pct=$(go tool cover -func=cover.out | tail -1 | awk '{sub("%","",$NF); print $NF}')
          echo "cobertura del nucleo: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 85) { print "PUERTA ROTA: cobertura " p "% < 85%"; exit 1 } }'
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # El job de test corre con la version declarada en go.mod (1.24): esa es la
      # puerta de compatibilidad. Aqui hace falta una mas nueva porque las
      # herramientas de seguridad la exigen, y setup-go v7 fija GOTOOLCHAIN=local,
      # asi que ya no se descarga sola.
      - uses: actions/setup-go@v7
        with: {go-version: '1.25'}
      # Versiones fijadas a proposito: con @latest la puerta se pone roja o verde
      # sin que nadie toque el codigo. Fijar el binario no envejece el analisis,
      # govulncheck baja la base de vulnerabilidades en cada ejecucion.
      - name: govulncheck (bloqueante)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: gosec (bloqueante)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet ./...
# Se amplia por etapas (ver ETAPAS.md): release firmada + SBOM CycloneDX (E1, con v0.2),
# fuzzing (E1), presupuestos + axe + TTFV (E2), evals nightly (E5), canario de conectores (E6).
# El CI puede usar herramientas de node (axe-core) aunque el producto no tenga npm.
