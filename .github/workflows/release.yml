# Release: binarios de las tres plataformas, imagen, SBOM, firma y publicacion.
#
# EL CANDADO ESTA ABIERTO. .github/marca-congelada se borro el 26-08-2026 (commit
# b321243) y NO existe: `candado` dice `publicar=si` en toda ejecucion, y la
# proxima etiqueta `v*` que se empuje PUBLICA DE VERDAD. Imagen en ghcr.io,
# release en GitHub y certificado en Rekor, que es append-only. No es un ensayo.
#
# Esta cabecera decia lo contrario hasta el 04-09-2026, y ese es el fallo mas
# caro que puede tener un fichero asi: el dato tiene puerta (distribucion_test.go
# imprime el estado real del candado en cada ejecucion) y la prosa no, asi que el
# dato se corrigio solo y la explicacion se quedo describiendo un mundo que ya no
# existe. Quien la leyera creeria que puede empujar una etiqueta sin consecuencia.
#
# LO QUE QUEDA ENTRE UNA ETIQUETA Y LA PUBLICACION, y son dos cosas, no una:
#
#   1. `publicar`: si sale algo de la maquina. Lo decide el candado.
#   2. `definitiva`: CON QUE FORMA sale. Lo decide la etiqueta. Solo vX.Y.Z sin
#      sufijo mueve `latest` y es la release actual; un -rc, -alpha o -beta se
#      publica bajo su propia etiqueta y sale marcado como prerelease.
#
# Que se cierre el candado otra vez se hace volviendo a poner ese fichero, en un
# commit propio. No hay secreto que activar ni variable que cambiar en un panel
# que nadie mira: se ve en el diff.
#
# Lo que se puede hacer sin publicar: workflow_dispatch corre el camino entero
# (construir, ejecutar, medir, empaquetar) y para en el borde, porque los pasos
# que salen de la maquina exigen ademas una etiqueta. Un workflow de release que
# solo se ha ejecutado el dia de la release es un workflow que se estrena el peor
# dia.
#
# ESA FRASE SE COBRO SU PIEZA EL 04-09-2026, EL DIA QUE SE EJECUTO POR PRIMERA
# VEZ. La primera ejecucion de la vida de este fichero (run 33853740997) murio
# en el primer paso de `imagen`: «Multi-platform build is not supported for the
# docker driver». Un runner limpio trae buildx con driver `docker`, que
# construye UNA arquitectura, y `publicar` depende de `imagen`. Una etiqueta
# empujada ese dia no habria publicado nada: habria dado una ejecucion roja.
#
# Y NO ESTABA EN ESTE FICHERO: estaba en el runner. Ninguna cantidad de leer el
# YAML lo habria encontrado. Es la razon entera de que exista workflow_dispatch.
#
# El recuento de ejecuciones NO se escribe aqui. Estuvo escrito («a 04-09-2026
# lleva CERO ejecuciones») y lo desmintio el propio trabajo que lo puso, el
# mismo dia: se ejecuto tres veces, dos verdes. Un cardinal en un comentario no
# tiene puerta, asi que caduca solo. Se mira con `gh run list
# --workflow=release.yml`, que es lo que aquel comentario ya decia y nadie
# volvio a correr.
#
# Lo vigila distribucion_test.go en la raiz: lee este fichero y exige que ningun
# paso que publique corra sin preguntar por el candado, y que ninguno mueva
# `latest` ni marque una release como actual sin preguntar por la forma de la
# etiqueta.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  # ---------------------------------------------------------------------------
  # El candado. Un trabajo aparte y no un `if` repetido: asi la decision se toma
  # UNA vez, se ve en la interfaz de Actions con su nombre, y los pasos de
  # publicacion dependen de una salida y no de que alguien copie bien la
  # condicion en cada uno.
  # ---------------------------------------------------------------------------
  candado:
    name: candado de marca
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.marca.outputs.publicar }}
      definitiva: ${{ steps.forma.outputs.definitiva }}
    steps:
      - uses: actions/checkout@v7
      - id: marca
        shell: bash
        run: |
          if [ -f .github/marca-congelada ]; then
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            echo "MARCA CONGELADA: no se publica nada en esta ejecucion."
            echo ""
            cat .github/marca-congelada
          else
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            echo "El candado de marca no esta. Esta ejecucion PUBLICA."
          fi

      # LA FORMA DE LA ETIQUETA, DECIDIDA UNA SOLA VEZ Y AQUI.
      #
      # `publicar` dice SI sale algo de la maquina. Esto dice CON QUE FORMA sale,
      # y son dos preguntas distintas que hasta el 04-09-2026 solo estaba
      # contestada la primera: `-t "${destino}:latest"` era incondicional y
      # `action-gh-release` se invocaba sin `prerelease`, asi que etiquetar
      # v0.1.0-rc1 habria movido ghcr.io/.../plazum:latest al candidato y lo
      # habria marcado como la release actual del repositorio.
      #
      # EL CRITERIO: `latest` y "release actual" son de una version DE VERDAD,
      # vX.Y.Z y nada mas. Un -rc, un -alpha o un -beta se publica bajo su propia
      # etiqueta, no mueve `latest` y sale marcado como prerelease.
      #
      # ESTA EN UN SOLO SITIO A PROPOSITO. Dos copias del criterio (una en la
      # imagen, otra en la release) son dos copias que se separan, y la que se
      # queda vieja es la que nadie mira. Los dos consumidores leen esta salida.
      #
      # Y FALLA CERRADO: la expresion regular solo dice `si` a la forma exacta.
      # Cualquier otra cosa (una rama en workflow_dispatch, un v1.0, un
      # v1.0.0+algo) es `no`, que es la respuesta que no mueve nada.
      - id: forma
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "definitiva=si" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} es una version definitiva: movera 'latest' y sera la release actual."
          else
            echo "definitiva=no" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} NO es una version definitiva (vX.Y.Z sin sufijo)."
            echo "  No movera 'latest' y, si llega a publicarse, saldra marcada como prerelease."
          fi

  # ---------------------------------------------------------------------------
  # EL CORPUS. Va el primero porque los binarios lo necesitan: cada uno lleva
  # dentro la huella del corpus que se publica en esta misma ejecucion.
  #
  # EL P0 QUE ESTE TRABAJO CIERRA. Hasta hoy la release publicaba SEIS BINARIOS Y
  # NINGUN CORPUS. La prueba de la maquina limpia pasaba con codigo 0 y llegaba
  # al calendario con el corpus de DEMOSTRACION: un paquete y tres relojes. Los
  # treinta marcos y sus doscientos veintidos relojes se quedaban en el
  # repositorio. Quien se bajara la primera release del mundo veria una demo
  # vacia y se iria pensando que plazum no trae nada, que es la unica primera
  # impresion que no se puede repetir.
  #
  # POR QUE UN ACTIVO Y NO go:embed. Esta escrito entero en cmd/plazum/corpus.go
  # y se resume en una linea: el corpus cambia cuando cambia el BOE, no cuando
  # cambia el programa, y `plazum update` existe para eso. Empotrarlo obligaria a
  # recompilar seis binarios y volver a firmarlos para mover una fecha.
  #
  # LA HUELLA LA CALCULA EL PROPIO PRODUCTO, no un `find | sha256sum` escrito
  # aqui. Una segunda implementacion del algoritmo en bash es una segunda lista
  # que se separa de la primera, y el dia que se separen el binario rechazaria su
  # propio corpus sin que nadie supiera por que. `go run` construye un plazum sin
  # ancla, que es todo lo que hace falta para RESUMIR (el ancla solo hace falta
  # para INSTALAR).
  # ---------------------------------------------------------------------------
  corpus:
    name: corpus de la release
    needs: candado
    runs-on: ubuntu-latest
    outputs:
      huella: ${{ steps.empaquetar.outputs.huella }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}

      - id: empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # La huella sale por la salida estandar y SOLA; el parte va por la de
          # errores. Asi esto no depende de recortar una linea de un texto.
          huella=$(go run ./cmd/plazum corpus --empaquetar paquetes --salida dist/plazum-corpus.tar.gz)

          # LA TERCERA FORMA DE LA NADA (invariante 8). Si el comando fallara de
          # una forma que dejara la salida vacia, una huella vacia viajaria a los
          # -ldflags de los binarios; el binario se construiria SIN ancla y
          # `--instalar` se negaria a funcionar en manos del comprador, que es un
          # fallo que solo se descubre despues de publicar. Se para aqui.
          if [[ ! "${huella}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "PUERTA ROTA: la huella del corpus ha salido como '${huella}'."
            echo "  Tienen que ser 64 caracteres hexadecimales. Sale de"
            echo "  'plazum corpus --empaquetar'. Un binario construido con una huella"
            echo "  vacia se niega a instalar corpus, y eso no se ve hasta despues de"
            echo "  publicar."
            exit 1
          fi

          echo "${huella}" > dist/plazum-corpus.huella
          echo "huella=${huella}" >> "$GITHUB_OUTPUT"
          echo "corpus empaquetado con huella ${huella}"
          ls -l dist

      # QUE LO EMPAQUETADO SEA CARGABLE, y no solo que exista. Un .tar.gz con los
      # ficheros equivocados pesa igual y se firma igual. Se instala de verdad,
      # en un directorio aparte, y se cuenta lo que hay dentro.
      - name: el corpus empaquetado se instala y trae los marcos
        shell: bash
        run: |
          set -uo pipefail
          go build -ldflags "-X main.anclaCorpus=${{ steps.empaquetar.outputs.huella }}" -o /tmp/plazum ./cmd/plazum
          ok=si
          /tmp/plazum corpus --instalar dist/plazum-corpus.tar.gz --destino /tmp/corpus > salida.txt 2>&1 || ok=no
          cat salida.txt
          if [ "$ok" != si ]; then
            echo "PUERTA ROTA: el corpus que se iba a publicar no se instala."
            exit 1
          fi
          n=$(find /tmp/corpus -name paquete.json | wc -l)
          echo "paquetes en el corpus empaquetado: $n"
          # EL MINIMO ES UNA IGUALDAD HACIA ABAJO Y SE DICE POR QUE. Un corpus
          # que encoja sin que nadie lo note es exactamente el P0 de arriba
          # volviendo por otra puerta: la release seguiria saliendo verde con un
          # solo paquete dentro.
          if [ "$n" -lt 30 ]; then
            echo "PUERTA ROTA: solo hay $n paquetes en el corpus empaquetado y hacen falta 30."
            echo "  El corpus real son los 30 marcos de paquetes/CORPUS.md mas demo-empresa,"
            echo "  nis1-es y psd2-es. Menos de 30 significa que se ha empaquetado el"
            echo "  directorio equivocado, y eso publica una demo vacia llamandola corpus."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-corpus
          path: dist/

  # ---------------------------------------------------------------------------
  # Los binarios, construidos en su propio sistema. Cruzar desde Linux compila,
  # y compilar no es arrancar: lo que el comprador de macOS descarga tiene que
  # haberse ejecutado al menos una vez en macOS antes de llevar una firma.
  # ---------------------------------------------------------------------------
  binarios:
    name: binarios en ${{ matrix.sistema }}
    needs: [candado, corpus]
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sistema: ubuntu-latest,  goos: linux,   sufijo: ''}
          - {sistema: macos-latest,   goos: darwin,  sufijo: ''}
          - {sistema: windows-latest, goos: windows, sufijo: '.exe'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}

      - name: la suite entera antes de empaquetar nada
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "suite completa antes de empaquetar (${{ matrix.sistema }})" 800 ./...
          cerrar_puertas

      # Las dos arquitecturas de cada sistema. -trimpath y -buildid= dejan el
      # binario reproducible: sin eso, nadie de fuera puede comprobar que lo
      # publicado sale de este codigo, y entonces la firma solo dice quien lo
      # subio, no que sea esto.
      # EL ANCLA ENTRA AQUI, y esto es lo que hace que el corpus se pueda
      # comprobar en la maquina del comprador. -X mete la huella del corpus de
      # ESTA release dentro del binario; cosign firma el binario despues, asi
      # que la huella viaja bajo esa firma sin necesitar una cadena aparte.
      #
      # Las comillas pasan a DOBLES por el ${{ }}. Con comillas simples, GitHub
      # sustituye igual (la sustitucion es previa al shell), pero dejarlo escrito
      # con simples invita a copiar la linea a un sitio donde no lo haga.
      - name: binarios de las dos arquitecturas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH="$arch" \
              go build -mod=readonly -trimpath \
              -ldflags="-s -w -buildid= -X main.anclaCorpus=${{ needs.corpus.outputs.huella }}" \
              -o "dist/plazum-${{ matrix.goos }}-${arch}${{ matrix.sufijo }}" ./cmd/plazum
          done
          ls -l dist

      # El binario nativo se EJECUTA aqui mismo. Un artefacto que nadie ha
      # arrancado no es un artefacto probado.
      - name: el binario nativo verifica el expediente demo
        shell: bash
        run: |
          set -uo pipefail
          arch=amd64
          if [ "${{ runner.arch }}" = "ARM64" ]; then arch=arm64; fi
          BIN="dist/plazum-${{ matrix.goos }}-${arch}${{ matrix.sufijo }}"
          chmod +x "$BIN" || true
          ok=si
          "$BIN" verify expediente-demo.json contexto-demo.json > salida.txt 2>&1 || ok=no
          cat salida.txt
          if [ "$ok" != si ] || ! grep -qF VERIFICADO salida.txt; then
            echo "PUERTA ROTA: el binario que se iba a publicar no verifica el expediente demo."
            echo "  Un artefacto firmado que no hace lo unico que promete es peor que no tenerlo."
            exit 1
          fi

      # EL BINARIO RECONOCE SU PROPIO CORPUS, comprobado con el corpus del
      # repositorio, que es byte a byte el que se acaba de empaquetar.
      #
      # POR QUE HACE FALTA ESTE PASO Y NO BASTA CON QUE EL BUILD SALIERA BIEN.
      # `-X main.anclaCorpus=...` NO FALLA cuando el simbolo no existe: si
      # alguien renombra la variable, mueve el paquete o se equivoca en el
      # nombre, `go build` sale con 0 y produce un binario SIN ancla. Ese
      # binario pasa todos los demas pasos de este workflow (verifica el
      # expediente, tiene su suma, se firma) y solo se rompe en la maquina del
      # comprador, cuando `--instalar` se niega a funcionar porque no tiene
      # contra que comprobar. Ese fallo llega despues de Rekor, que es
      # append-only.
      #
      # `--verificar` sale con 1 tanto si no cuadra como si no hay ancla, que es
      # justo lo que hace falta aqui: las dos cosas son un binario que no se
      # puede publicar.
      - name: el binario reconoce el corpus que se publica con el
        shell: bash
        run: |
          set -uo pipefail
          arch=amd64
          if [ "${{ runner.arch }}" = "ARM64" ]; then arch=arm64; fi
          BIN="dist/plazum-${{ matrix.goos }}-${arch}${{ matrix.sufijo }}"
          ok=si
          "$BIN" corpus --verificar paquetes > ancla.txt 2>&1 || ok=no
          cat ancla.txt
          if [ "$ok" != si ]; then
            echo "PUERTA ROTA: el binario que se iba a publicar no reconoce su propio corpus."
            echo "  O el -ldflags -X no ha entrado (mira si alguien renombro main.anclaCorpus:"
            echo "  -X no falla cuando el simbolo no existe, deja el binario sin ancla), o el"
            echo "  corpus del repositorio no es el que empaqueto el trabajo 'corpus'."
            echo "  Publicar esto da un binario que se niega a instalar corpus en manos del"
            echo "  comprador, y eso se descubre despues de firmar en Rekor."
            exit 1
          fi

      - name: sumas
        shell: bash
        run: |
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum ./* > "SHA256SUMS-${{ matrix.goos }}"
          else shasum -a 256 ./* > "SHA256SUMS-${{ matrix.goos }}"; fi
          cat "SHA256SUMS-${{ matrix.goos }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}
          path: dist/

  # ---------------------------------------------------------------------------
  # La imagen. Se construye SIEMPRE y solo se sube si el candado esta abierto.
  # ---------------------------------------------------------------------------
  imagen:
    name: imagen Docker
    needs: candado
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7

      # EL DRIVER POR DEFECTO NO SABE CONSTRUIR DOS ARQUITECTURAS, y este
      # workflow llevaba desde que se escribio dando por hecho que si.
      #
      # Lo encontro su PRIMERA EJECUCION, el 04-09-2026 (run 33853740997,
      # workflow_dispatch sobre tramo2/release), no una revision:
      #
      #   ERROR: failed to build: Multi-platform build is not supported for
      #   the docker driver.
      #
      # Un runner limpio trae buildx con el driver `docker`, que solo construye
      # la arquitectura de la maquina. Para dos hace falta un builder con driver
      # `docker-container` (setup-buildx) y los binfmt de la otra arquitectura
      # (setup-qemu). Sin esto, `imagen` muere en su primer paso, y como
      # `publicar` depende de `imagen`, una etiqueta NO habria publicado: habria
      # dado una ejecucion roja. Menos malo que publicar mal, y aun asi es
      # estrenarse el peor dia.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: construir (las dos arquitecturas, sin salir de aqui)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .
          # --load EXPLICITO. Con el driver `docker-container` el resultado se
          # queda en la cache del builder y NO entra en el almacen de imagenes,
          # asi que el `docker run` del paso siguiente no la encontraria. Es la
          # trampa que viene de regalo con el arreglo de arriba.
          docker buildx build --load -t plazum:release .

      - name: la imagen verifica antes de que nadie la firme
        run: |
          set -uo pipefail
          ok=si
          docker run --rm plazum:release verify expediente-demo.json contexto-demo.json > v.txt 2>&1 || ok=no
          cat v.txt
          if [ "$ok" != si ] || ! grep -qF VERIFICADO v.txt; then
            echo "PUERTA ROTA: la imagen que se iba a publicar no verifica el expediente demo."
            exit 1
          fi

      # ---- de aqui abajo, todo sale de la maquina y todo pregunta -----------

      # LA ETIQUETA MANDA AQUI TAMBIEN, y hasta el 04-09-2026 no lo hacia.
      #
      # El trabajo `publicar` exige `startsWith(github.ref, 'refs/tags/v')` y
      # estos dos pasos NO, asi que un `workflow_dispatch` sobre main subia una
      # imagen a ghcr.io etiquetada `latest` y `main` desde un commit
      # cualquiera. La discrepancia no se veia porque el candado de
      # `.github/marca-congelada` tapaba las dos ramas a la vez; ese fichero se
      # borro el 26-08-2026 y con el se destapo esta.
      #
      # Y NADIE LO HABRIA VISTO EJECUTANDO: este workflow no se ha ejecutado
      # NUNCA (cero ejecuciones y cero etiquetas en el remoto, medido el
      # 04-09-2026), asi que la primera vez que alguien lo disparara a mano
      # habria publicado `latest`. Lo encontro el barrido de las casillas
      # cerradas, no una puerta.
      #
      # Un `latest` que sale de un commit sin etiqueta es exactamente lo que un
      # tercero se descarga creyendo que es una release.
      - name: entrar en el registro
        if: needs.candado.outputs.publicar == 'si' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: subir la imagen
        if: needs.candado.outputs.publicar == 'si' && startsWith(github.ref, 'refs/tags/v')
        env:
          DEFINITIVA: ${{ needs.candado.outputs.definitiva }}
        run: |
          set -euo pipefail
          destino="ghcr.io/${GITHUB_REPOSITORY,,}"
          etiqueta="${GITHUB_REF_NAME}"

          # LA TERCERA FORMA DE LA NADA (invariante 8): presente y no
          # interpretable. Si la salida se queda vacia porque alguien renombro
          # el `id:` del paso que la calcula, tomarla por "no" seria comodo y
          # seria inventarse un valor: `latest` dejaria de moverse PARA SIEMPRE
          # y ninguna release lo notaria, porque el fallo va en la direccion que
          # nadie mira. Se para y se dice.
          case "${DEFINITIVA}" in
            si|no) ;;
            *)
              echo "PUERTA ROTA: la forma de la etiqueta llega como '${DEFINITIVA}' y solo puede ser si o no."
              echo "  Sale de needs.candado.outputs.definitiva, que calcula el paso 'forma' del trabajo candado."
              echo "  Probablemente se renombro ese id o su salida. Arreglo: volver a conectarlos."
              exit 1
              ;;
          esac

          # Las etiquetas se ARMAN, no se escriben en la linea: asi la condicion
          # se lee entera en un sitio y no hay dos comandos casi iguales que se
          # separen con el tiempo.
          etiquetas=(-t "${destino}:${etiqueta}")
          if [ "${DEFINITIVA}" = si ]; then
            etiquetas+=(-t "${destino}:latest")
            echo "Se subira ${destino}:${etiqueta} y se movera ${destino}:latest a esta imagen."
          else
            echo "Se subira ${destino}:${etiqueta} y NO se movera ${destino}:latest."
            echo "  Motivo: ${etiqueta} no es una version definitiva (vX.Y.Z sin sufijo)."
            echo "  'latest' es lo que se descarga quien no elige version, asi que apunta a la"
            echo "  ultima version de verdad y no a un candidato. Para moverlo, etiqueta vX.Y.Z."
          fi

          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${etiqueta}" \
            "${etiquetas[@]}" --push .

      # EL MOTIVO SE DICE, Y SON DOS. Antes este paso solo sabia nombrar uno, el
      # candado de marca, asi que el dia que el candado se abriera y faltara la
      # etiqueta habria dicho un motivo falso. Un mensaje que nombra la causa
      # equivocada manda a arreglar lo que no esta roto.
      - name: la imagen no se ha subido
        if: needs.candado.outputs.publicar != 'si' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "La imagen se ha construido y probado, y NO se ha subido a ningun registro."
          if [ "${{ needs.candado.outputs.publicar }}" != si ]; then
            echo "Motivo: el candado de marca (.github/marca-congelada). Ver docs/marca.md."
          fi
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/v}" ]; then
            echo "Motivo: esto no es una etiqueta de version (ref: ${GITHUB_REF})."
            echo "  Una imagen 'latest' que sale de un commit sin etiquetar es lo que un"
            echo "  tercero se descarga creyendo que es una release. Para publicar de verdad,"
            echo "  etiqueta con vX.Y.Z y empuja la etiqueta."
          fi

  # ---------------------------------------------------------------------------
  # Firma y release. Todo el trabajo esta condicionado, no solo sus pasos: sin
  # candado abierto no se instala ni cosign, que ya es un paso hacia Rekor.
  # ---------------------------------------------------------------------------
  publicar:
    name: firmar y publicar
    needs: [candado, corpus, binarios, imagen]
    if: needs.candado.outputs.publicar == 'si' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write, id-token: write}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: {path: recogido}
      - name: juntar los artefactos
        run: |
          mkdir -p dist
          find recogido -type f -exec cp {} dist/ \;
          ls -l dist

      # QUE EL CORPUS ESTE EN LO QUE SE VA A FIRMAR, comprobado y no supuesto.
      #
      # `find ... -exec cp` aplasta el arbol en un solo directorio: si el
      # artefacto dist-corpus no llegara (el trabajo se salto, el nombre cambio,
      # la descarga fallo en silencio), aqui no habria ni un error, habria un
      # `dist` con seis binarios y sin corpus. Y la release saldria: verde,
      # firmada, y sin lo unico que este trabajo se anadio para publicar.
      #
      # Es el P0 original con otro traje, asi que se comprueba en el ultimo sitio
      # donde todavia se puede parar sin haber escrito en Rekor.
      - name: el corpus esta en lo que se va a firmar
        run: |
          set -euo pipefail
          faltan=0
          for f in plazum-corpus.tar.gz plazum-corpus.huella; do
            if [ ! -f "dist/$f" ]; then
              echo "FALTA dist/$f"
              faltan=$((faltan + 1))
            fi
          done
          if [ "$faltan" -gt 0 ]; then
            echo "PUERTA ROTA: se iba a publicar una release SIN el corpus."
            echo "  Sale del trabajo 'corpus' como artefacto dist-corpus. Si ese trabajo"
            echo "  se salto o cambio de nombre, esto llega aqui vacio y la release sale"
            echo "  verde con seis binarios y ningun marco dentro: el comprador se baja"
            echo "  una demo vacia. Arreglo: mira el trabajo 'corpus' de esta ejecucion."
            exit 1
          fi
          echo "corpus presente, huella publicada:"
          cat dist/plazum-corpus.huella

      - name: SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with: {format: cyclonedx-json, output-file: dist/sbom.cdx.json}

      - name: cosign
        uses: sigstore/cosign-installer@v3

      # OJO: esto publica el certificado en el log PUBLICO de Rekor, que es
      # append-only. Es el paso irreversible de todo el proyecto.
      - name: firmar artefactos
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done

      # `prerelease` SALE DEL MISMO CRITERIO QUE `latest`, y no de una segunda
      # copia escrita aqui: sin el, un v0.1.0-rc1 aparece como la release actual
      # del repositorio y es lo que la portada ofrece descargar. La expresion se
      # lee del reves a proposito (definitiva != si) porque el valor por defecto
      # de `prerelease` es false, o sea el permisivo, y el que sale por olvido.
      - name: publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ needs.candado.outputs.definitiva != 'si' }}
          make_latest: ${{ needs.candado.outputs.definitiva == 'si' }}
  # ---------------------------------------------------------------------------
  # Y el ensayo, que es lo que corre cuando esto no publica: el mismo camino
  # hasta el borde.
  #
  # EL `if` LLEVA `!cancelled()` Y NO ES COSMETICA. Un trabajo con `needs` se
  # SALTA cuando cualquiera de los que necesita falla, salvo que su condicion
  # diga lo contrario. O sea que el trabajo cuyo unico oficio es contar que
  # habria salido de aqui DESAPARECIA JUSTO CUANDO ALGO SALIA MAL.
  #
  # Demostrado sobre una ejecucion real y no sobre una mutacion: en el run
  # 33853740997 (04-09-2026, el primero que se lanzo en la vida de este fichero)
  # `imagen Docker` fallo, y `ensayo sin publicar` salio `skipped`. La unica
  # salida que explicaba el estado de la release se callo en la unica ejecucion
  # que necesitaba explicacion.
  #
  # Se usa `!cancelled()` y no `always()` a proposito: si alguien cancela la
  # ejecucion a mano, no hay nada que ensayar y no se gasta un runner en
  # decirlo. `always()` tambien corre sobre una cancelacion, que es ruido.
  # ---------------------------------------------------------------------------
  ensayo:
    name: ensayo sin publicar
    needs: [candado, corpus, binarios, imagen]
    if: ${{ !cancelled() && (needs.candado.outputs.publicar != 'si' || !startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SIN ARTEFACTOS TAMBIEN SE ENSAYA, y ese es el caso que el arreglo de
      # arriba viene a rescatar: si `binarios` fallo no hay nada que descargar,
      # y `download-artifact` sale con error. Que ESE error mate el ensayo seria
      # volver a callarse en la ejecucion rota, por otra puerta.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {path: recogido}
      - name: que habria salido de aqui
        shell: bash
        run: |
          # EL ESTADO DE LOS TRABAJOS DE LOS QUE ESTE DEPENDE, PRIMERO Y SIEMPRE.
          # Es lo que convierte este trabajo en util cuando algo ha fallado: sin
          # esta linea, un ensayo que corre tras un fallo lista cero artefactos
          # y no dice que sea por eso.
          echo "Estado de lo que este ensayo necesitaba:"
          echo "  candado:  ${{ needs.candado.result }}"
          echo "  corpus:   ${{ needs.corpus.result }}"
          echo "  binarios: ${{ needs.binarios.result }}"
          echo "  imagen:   ${{ needs.imagen.result }}"
          echo ""
          # LA HUELLA DEL CORPUS, EN EL ENSAYO TAMBIEN. Es el dato que dice si
          # esta ejecucion habria publicado un corpus o ninguno, y es lo unico
          # que un workflow_dispatch puede ensenar de todo el trabajo nuevo.
          echo "  huella del corpus de esta ejecucion: '${{ needs.corpus.outputs.huella }}'"
          echo "    (vacia = el trabajo 'corpus' no llego a producirla, y entonces los"
          echo "     binarios de esta ejecucion NO llevan ancla y se negarian a instalar"
          echo "     corpus en manos de quien se los bajara)"
          echo ""

          n=0
          if [ -d recogido ]; then
            n=$(find recogido -type f | wc -l)
          fi
          if [ "$n" -eq 0 ]; then
            # CERO ARTEFACTOS SE DICE Y NO SE PINTA COMO UNA LISTA VACIA. Una
            # lista vacia debajo de «Artefactos construidos» se lee como «no
            # habia nada que construir», que es tranquilizador y falso.
            echo "SIN ARTEFACTOS: no se ha recogido ni un fichero."
            echo "  Si algun trabajo de arriba no dice 'success', ESA es la causa y no"
            echo "  hay nada que ensayar todavia. Arregla eso antes de mirar lo de abajo."
          else
            echo "Artefactos construidos y probados en su propio sistema ($n):"
            find recogido -type f | sort
          fi
          echo ""
          echo "NADA de esto se ha publicado, ni firmado, ni subido a Rekor."
          echo "Motivos (pueden ser los dos, y se dicen los dos):"
          motivos=0

          # EL `cat` A SECAS MATABA EL PASO, y ya lo hizo una vez el 26-08-2026
          # en etapa2-distribucion.yml: los pasos bash de GitHub corren con -e y
          # `cat` de un fichero que no existe sale con 1. El candado esta puesto
          # PARA QUITARSE, asi que leerlo como si fuera permanente es leerlo mal.
          if [ -f .github/marca-congelada ]; then
            motivos=$((motivos + 1))
            echo "  - el candado de marca (.github/marca-congelada). Ver docs/marca.md:"
            sed 's/^/      /' .github/marca-congelada
          fi
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/v}" ]; then
            motivos=$((motivos + 1))
            echo "  - esto no es una etiqueta de version (ref: ${GITHUB_REF})."
            echo "    Para publicar de verdad, etiqueta con vX.Y.Z y empuja la etiqueta."
          fi

          # CERO MOTIVOS ES UNA CONTRADICCION, NO UN CASO SILENCIOSO. Si este
          # trabajo ha corrido, su `if` decidio que esta ejecucion no publica; si
          # el cuerpo no encuentra ni un motivo, el `if` y el cuerpo se han
          # separado y uno de los dos miente. Imprimir una lista vacia debajo de
          # "Motivos:" seria la version tranquilizadora de no saber por que.
          if [ "$motivos" -eq 0 ]; then
            echo "  (ninguno)"
            echo ""
            echo "PASO ROTO: el ensayo ha corrido y no sabe decir por que no se publica."
            echo "  El 'if' de este trabajo y este cuerpo cuentan los mismos dos motivos,"
            echo "  asi que llegar aqui significa que se han separado. Arreglo: cuadrarlos."
            exit 1
          fi
