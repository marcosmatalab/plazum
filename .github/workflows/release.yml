name: release
on:
  push:
    tags: ['v*']
permissions: {contents: write, id-token: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: '1.24'}
      - name: tests completos antes de publicar nada
        shell: bash
        run: |
          source .github/puerta.sh
          puerta "suite completa antes de firmar la release" 700 ./...
          cerrar_puertas
      - name: binarios
        run: |
          mkdir -p dist
          for os_arch in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${os_arch%/*} GOARCH=${os_arch#*/} \
              go build -trimpath -ldflags="-s -w" -o "dist/dutiq-${os_arch%/*}-${os_arch#*/}$([ ${os_arch%/*} = windows ] && echo .exe)" ./cmd/dutiq
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: SBOM CycloneDX
        uses: anchore/sbom-action@v0
        with: {format: cyclonedx-json, output-file: dist/sbom.cdx.json}
      - name: firma keyless (cosign)
        uses: sigstore/cosign-installer@v3
      - name: firmar artefactos
        run: |
          for f in dist/dutiq-* dist/SHA256SUMS dist/sbom.cdx.json; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - name: publicar release
        uses: softprops/action-gh-release@v3
        with: {files: dist/*}
