<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">plazum</title>
  <desc id="d">plazum: el GRC de continuidad. Plazos con reloj legal, motor determinista en Go, expediente verificable sin red y cero dependencias.</desc>
  <!--
    Cabecera de la portada en castellano. Usa la marca de
    superficies/pantallas/estatico/plazum-marca.svg (el reloj cortado por la
    linea del plazo) y el acento #4a3ca6 de la hoja de estilos del producto.
    Sin cifras a proposito: un numero dibujado en un SVG no lo vigila ninguna
    puerta, y los de la portada viven en su bloque con test.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231c55"/>
      <stop offset="0.55" stop-color="#4a3ca6"/>
      <stop offset="1" stop-color="#6d5ce0"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.88" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#fondo)"/>
  <rect width="1200" height="320" rx="20" fill="url(#brillo)"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.16">
    <circle cx="1040" cy="132" r="96" stroke-width="10"/>
    <circle cx="1040" cy="132" r="62" stroke-width="2"/>
    <path d="M1040 70 V132 H1086" stroke-width="10" stroke-linejoin="round"/>
    <path d="M1168 20 V244" stroke-width="12"/>
  </g>

  <g transform="translate(64 60) scale(2.25)">
    <rect width="32" height="32" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    <circle cx="14" cy="16" r="8.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M14 10.5 V16 H18" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25.5 5.5 V26.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="156" y="118" font-size="64" font-weight="700" letter-spacing="-1.5">plazum</text>
    <text x="64" y="186" font-size="28" font-weight="600">El GRC de continuidad: no pierdas nunca la conformidad.</text>
    <text x="64" y="222" font-size="18" fill-opacity="0.82">Qué normas te aplican, qué tienes que hacer y para qué fecha exacta, con su cita legal.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">
    <rect x="64" y="248" width="214" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="86" cy="267" r="5" fill="#7ee2a8"/>
    <text x="100" y="272">Plazos con reloj legal</text>

    <rect x="290" y="248" width="236" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="312" cy="267" r="5" fill="#7ee2a8"/>
    <text x="326" y="272">Motor determinista en Go</text>

    <rect x="538" y="248" width="282" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="560" cy="267" r="5" fill="#7ee2a8"/>
    <text x="574" y="272">Expediente verificable sin red</text>

    <rect x="832" y="248" width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="854" cy="267" r="5" fill="#7ee2a8"/>
    <text x="868" y="272">Cero dependencias</text>
  </g>
</svg>
