# Configuracion de staticcheck. Solo se RESTA de lo que trae por defecto, y con
# el motivo escrito: una lista de comprobaciones desactivadas sin porque es una
# lista que crece cada vez que alguien tiene prisa.
#
# "inherit" es el conjunto por defecto de staticcheck. Escribir "all" en su
# lugar ENCENDERIA ST1000, ST1003 y ST1020-23, que exigen comentarios de
# documentacion con la forma inglesa ("Foo does ...") y nombres con las siglas
# inglesas. Este proyecto escribe el dominio en espanol a proposito, asi que
# "all" no seria mas rigor: seria un ruido que obligaria a suprimir a mano
# cientos de sitios, y una supresion masiva es la forma de apagar un linter sin
# que parezca que se apago.
#
# ST1005 (error strings should not be capitalized or end with punctuation).
# Choca de frente con la convencion de la casa, que esta en CLAUDE.md: "errores
# accionables: causa, arreglo, y cita si es del dominio". Un error asi son dos o
# tres frases y termina en punto, como cualquier frase. La alternativa seria un
# `//lint:ignore` por cada error del producto, o sea cientos de supresiones para
# sostener una regla de estilo ingles que aqui no aplica. Se desactiva una vez y
# se dice por que, que es lo contrario de esconderla.
checks = ["inherit", "-ST1005"]
